name: AGENTS.md Integrity

# Thin caller for the shared reusable AGENTS.md integrity check. The checker
# lives in Comfy-Org/github-workflows (single source of truth) and is loaded
# from the pinned workflows_ref — never from this repo's checkout, so a PR
# cannot rewrite its own checker. Keep `workflows_ref` in lock-step with the
# `uses:` SHA; the AGENTS_MD_CALLERS bump dispatcher opens SHA-bump PRs
# automatically once this repo is registered.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agents-md:
    permissions:
      contents: read
    uses: Comfy-Org/github-workflows/.github/workflows/agents-md-integrity.yml@1376eeff8a7a27caf9813e0da7f576fa47ea1989 # github-workflows main (1376eef)
    with:
      workflows_ref: 1376eeff8a7a27caf9813e0da7f576fa47ea1989
